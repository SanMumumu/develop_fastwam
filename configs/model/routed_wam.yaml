defaults:
  - dream_fastwam
  - _self_

_target_: fastwam.routed_runtime.create_routed_wam

# ---------------------------------------------------------------- generative
# The Dream expert denoises its multi-modal targets instead of regressing them.
# With `enabled: false` the model is behaviourally identical to dream_fastwam.
generative_dream:
  enabled: true
  freq_dim: 256

# Flow-matching schedule for the Dream branch. `inference_steps: 1` is the
# deployed setting; interface distillation is what makes one step sufficient.
dream_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000
  inference_steps: 1

# ------------------------------------------------------------------- router
# Semantic tanh QK gating (zero initialization), computed once per observation/replan.
# full / static / dynamic preserve K/V; only Action-to-Dream logits are scaled.
router:
  mode: none                  # legacy router disabled
  routing_mode: dynamic
  router_enabled: true        # false is equivalent to full
  router_warmup_steps: 0      # optimizer steps; set per training run
  router_hidden_dim: 128
  router_gate_loss_weight: 0.0  # Router learns from Action loss without an information cost.

# -------------------------------------------------------- interface distill
# Compress the multi-step Dream rollout into one forward, supervising the
# per-layer Dream K/V that the action expert actually reads.
# Requires generative_dream.enabled=true and freeze_video_expert=true.
interface_distill:
  enabled: false
  teacher_steps: 8
  student_steps: 1
  ema_decay: 0.995
  layers: null
  lambda_k: 1.0
  lambda_v: 1.0
  lambda_total: 1.0
  route_aware: true
  warmup_ratio: 0.1
  detach_teacher: true

finetune_action_only: false
