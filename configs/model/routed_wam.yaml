defaults:
  - dream_fastwam
  - _self_

_target_: fastwam.routed_runtime.create_routed_wam

# ---------------------------------------------------------------- generative
# Dream directly regresses future targets in one forward, without Dream noise.
# Generative Dream remains available only for explicitly selected legacy tasks.
generative_dream:
  enabled: false
  freq_dim: 256

# Used only when generative_dream.enabled=true; unused by direct regression.
dream_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000
  inference_steps: 1

# ------------------------------------------------------------------- router
# Learned priors: va = Video + Action, da = Dream + Action, static = learned constants.
# The existing shared mixed softmax receives +log(gate) on Dream columns only.
router:
  mode: learned
  routing_mode: null
  gate_type: va              # va | da | static; mode=none disables these priors.
  group_granularity: modality_horizon_view
  rank: 64
  temperature: 1.0
  bias_init: 4.0
  warmup_ratio: 0.1
  lambda_budget: 0.0          # Router learns exclusively through Action loss.
  gate_threshold: 1.0e-3
  hard_prune_at_inference: true
  min_keep_tokens: 0
  log_statistics: true
  # Compatibility settings for explicitly selected full/static/dynamic QK tasks.
  router_enabled: true
  router_warmup_steps: 0
  router_hidden_dim: 128
  router_gate_loss_weight: 0.0  # Router learns from Action loss without an information cost.

# -------------------------------------------------------- interface distill
# Compress the multi-step Dream rollout into one forward, supervising the
# per-layer Dream K/V that the action expert actually reads.
# Requires generative_dream.enabled=true and freeze_video_expert=true.
interface_distill:
  enabled: false
  teacher_steps: 8
  student_steps: 1
  ema_decay: 0.995
  layers: null
  lambda_k: 1.0
  lambda_v: 1.0
  lambda_total: 1.0
  route_aware: true
  warmup_ratio: 0.1
  detach_teacher: true

finetune_action_only: false
training_mode: dense_joint
