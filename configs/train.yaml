# @package _global_

defaults:
  - _self_
  - data: null
  - model: null
  - task: null


output_dir: ./runs/train/${now:%Y-%m-%d}_${now:%H-%M-%S}

# dataloading
batch_size: 16
num_workers: 4
# Page-locked CUDA host memory is optional and can fail in constrained
# containers or with large video batches. Enable explicitly only after
# verifying that the runtime supports it.
pin_memory: false

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1.0e-4
num_epochs: 2
max_steps: null
log_every: 10
save_every: 100
eval_every: 50
eval_num_inference_steps: 10

# training
gradient_accumulation_steps: 1
mixed_precision: "bf16" # one of: [no, fp16, bf16]
seed: 42
max_grad_norm: 1.0
weight_decay: 0.0
resume: null
freeze_video_expert: false

# Optional cluster topology contract. When set, it is the single source of truth
# for the effective batch size: a launcher can cross-check
#   num_machines = expected_global_batch_size / (batch_size * grad_accum * gpus_per_node)
# against the node count in its job manifest, failing fast on disagreement.
# Also asserted at runtime by Wan22Trainer against the real world size, so a run
# can never silently train at a different global batch than its recipe claims.
# Leave null to disable both checks (single-node development).
expected_global_batch_size: null

# wandb
wandb:
  enabled: false
  workspace: null
  project: dream_fastwam
  name: train
  group: null
  mode: online

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
