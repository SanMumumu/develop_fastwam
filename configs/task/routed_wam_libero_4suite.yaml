# @package _global_
#
# Full four-suite LIBERO training for the main table. Same recipe as
# routed_wam_libero_goal, on all four suites.

defaults:
  - override /data: libero_dream_4suite_2cam
  - override /model: routed_wam
  - _self_

output_dir: ./runs/routed_wam_libero_4suite/${now:%Y-%m-%d}_${now:%H-%M-%S}

batch_size: 32
num_workers: 4
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 4
max_steps: null
log_every: 10
save_every: 2000
eval_every: 0
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
freeze_video_expert: true

model:
  mot_checkpoint_mixed_attn: true
  loss:
    lambda_video: 0.0
    lambda_action: 1.0
    lambda_dream: 0.1
