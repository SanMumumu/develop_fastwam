# @package _global_
#
# R0 -- matched control for the Dream Imagination Distillation ladder.
#
# This is the STRUCTURAL baseline: it uses the stock `dream_fastwam` model, which
# genuinely has no distillation head, rather than the DID model with
# `lambda_did: 0`. Everything else is held identical to the DID rungs -- same
# data, same batch/steps/LR, same lambda_video, same freeze setting -- so the
# only difference between R0 and R1 is the presence of the mechanism.
#
# NOTE: this is NOT the same point as `dream_fastwam_libero_goal.yaml`, which
# uses `lambda_video: 0.0`. DID needs the full 9-frame video path to have any
# future frames to distil from, so the whole ladder runs with lambda_video > 0.
# Do not compare these numbers against the published lambda_video=0 dream runs.

defaults:
  - override /data: libero_goal_2cam
  - override /model: dream_fastwam
  - _self_

output_dir: ./runs/dream_distill_libero_goal_r0/${now:%Y-%m-%d}_${now:%H-%M-%S}

batch_size: 32
num_workers: 4
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 4
max_steps: null
log_every: 10
save_every: 2000
eval_every: 0
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
# Frozen video expert = a fixed teacher for the DID rungs, and no optimizer
# state for its 5 B parameters. The video loss then has no trainable parameters
# upstream, so it contributes no gradient and serves only as a diagnostic.
freeze_video_expert: true

model:
  mot_checkpoint_mixed_attn: true
  loss:
    # > 0 so the video branch runs over the full clip, matching the DID rungs.
    lambda_video: 1.0
    lambda_action: 1.0
    lambda_dream: 0.1
