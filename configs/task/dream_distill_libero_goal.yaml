# @package _global_
#
# R1 -- Dream Imagination Distillation, the treatment.
#
# Dream tokens are supervised to predict the video expert's future-frame
# representation. Training-time only: inference is byte-for-byte the stock
# DreamFastWAM path (Dream reads the current frame, prefill still valid).
#
# libero_goal uses future_offsets [16, 32]; with the VAE's temporal downsample
# factor of 4 those map exactly onto latent frames 4 and 8 of the 9-frame clip.
#
# Only counts as working if it beats R3 (dream_distill_libero_goal_teacher_current),
# not merely R0 -- see the note in src/fastwam/models/wan22/dream_distill/__init__.py.
defaults:
  - override /data: libero_goal_2cam
  - override /model: dream_fastwam_distill
  - _self_

output_dir: ./runs/dream_distill_libero_goal_r1/${now:%Y-%m-%d}_${now:%H-%M-%S}

batch_size: 32
num_workers: 4
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 4
max_steps: null
log_every: 10
save_every: 2000
eval_every: 0
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
# Frozen video expert = a fixed teacher for the DID rungs, and no optimizer
# state for its 5 B parameters. The video loss then has no trainable parameters
# upstream, so it contributes no gradient and serves only as a diagnostic.
freeze_video_expert: true

model:
  mot_checkpoint_mixed_attn: true
  loss:
    # > 0 so the video branch runs over the full clip, matching the DID rungs.
    lambda_video: 1.0
    lambda_action: 1.0
    lambda_dream: 0.1
