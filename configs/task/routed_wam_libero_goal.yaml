# @package _global_
#
# Train regression Dream and Video/Action group routing on LIBERO-goal.
# Dream directly predicts depth/DINO/SAM/dyn futures; Video stays frozen.

defaults:
  - override /data: libero_goal_2cam
  - override /model: routed_wam
  - _self_

output_dir: ./runs/routed_wam_libero_goal/${now:%Y-%m-%d}_${now:%H-%M-%S}

batch_size: 32
num_workers: 4
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 4
max_steps: null
log_every: 10
save_every: 2000
eval_every: 0
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: ./checkpoints/libero_uncond_2cam224_100m.pt
# The split Video-once prefill is only exact while the Video expert's K/V do not
# depend on the diffusion step, which requires it to stay frozen.
freeze_video_expert: true

model:
  mot_checkpoint_mixed_attn: true
  loss:
    # The split path never denoises future video frames, so lambda_video must be
    # zero; the video branch contributes the current-frame world representation.
    lambda_video: 0.0
    lambda_action: 1.0
    lambda_dream: 0.1
