# @package _global_
#
# R3 -- control: distil from the CURRENT frame instead of future frames.
#
# Identical to R1 except the teacher. If R3 matches or beats R1, the gain is
# coming from having one more representation-level supervision signal, NOT from
# future information -- which is what ckpt_eval_report.md's future_offsets=[0]
# runs (the best of the Dream group) already hint at. Run this before believing R1.
defaults:
  - override /data: libero_goal_2cam
  - override /model: dream_fastwam_distill
  - _self_

output_dir: ./runs/dream_distill_libero_goal_r3/${now:%Y-%m-%d}_${now:%H-%M-%S}

batch_size: 32
num_workers: 4
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 4
max_steps: null
log_every: 10
save_every: 2000
eval_every: 0
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
# Frozen video expert = a fixed teacher for the DID rungs, and no optimizer
# state for its 5 B parameters. The video loss then has no trainable parameters
# upstream, so it contributes no gradient and serves only as a diagnostic.
freeze_video_expert: true

model:
  mot_checkpoint_mixed_attn: true
  loss:
    # > 0 so the video branch runs over the full clip, matching the DID rungs.
    lambda_video: 1.0
    lambda_action: 1.0
    lambda_dream: 0.1
  dream_distill:
    teacher: current
